<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="Inter, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect x="180" y="8" width="320" height="44" rx="7" fill="#fdf5e6" stroke="#e09f1f" stroke-width="1.8"/>
<text x="340.0" y="26.5" font-size="11.2" font-weight="400" fill="#1f2933" text-anchor="middle">Light of frequency f arrives at a material</text>
<text x="340.0" y="41.6" font-size="11.2" font-weight="400" fill="#1f2933" text-anchor="middle">(each photon carries energy E = hf)</text>
<line x1="340" y1="52" x2="340" y2="72" stroke="#52606d" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="130" y="74" width="420" height="50" rx="7" fill="#f5f7fa" stroke="#52606d" stroke-width="1.3"/>
<text x="340.0" y="95.3" font-size="11.6" font-weight="400" fill="#1f2933" text-anchor="middle">Does the material have an allowed jump (electronic,</text>
<text x="340.0" y="111.0" font-size="11.6" font-weight="400" fill="#1f2933" text-anchor="middle">vibrational, or rotational) whose energy matches hf?</text>
<path d="M130,99 L90,99 L90,150" fill="none" stroke="#52606d" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M550,99 L590,99 L590,150" fill="none" stroke="#52606d" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="98" y="92" font-size="12" font-weight="800" fill="#2e6fdb" text-anchor="end">NO</text>
<text x="582" y="92" font-size="12" font-weight="800" fill="#d1495b">YES</text>
<rect x="8" y="152" width="320" height="58" rx="7" fill="#eef4fd" stroke="#2e6fdb" stroke-width="1.8"/>
<text x="168.0" y="169.9" font-size="11.2" font-weight="700" fill="#1f2933" text-anchor="middle">NOT ABSORBED</text>
<text x="168.0" y="185.0" font-size="11.2" font-weight="400" fill="#1f2933" text-anchor="middle">Electrons are shaken off-resonance and</text>
<text x="168.0" y="200.2" font-size="11.2" font-weight="400" fill="#1f2933" text-anchor="middle">re-radiate in step with the wave (coherently)</text>
<rect x="352" y="152" width="320" height="58" rx="7" fill="#fbeef0" stroke="#d1495b" stroke-width="1.8"/>
<text x="512.0" y="169.9" font-size="11.2" font-weight="700" fill="#1f2933" text-anchor="middle">ABSORBED</text>
<text x="512.0" y="185.0" font-size="11.2" font-weight="400" fill="#1f2933" text-anchor="middle">The photon disappears; its energy lifts the</text>
<text x="512.0" y="200.2" font-size="11.2" font-weight="400" fill="#1f2933" text-anchor="middle">atom or molecule into an excited state</text>
<rect x="22" y="228" width="306" height="42" rx="7" fill="#ffffff" stroke="#52606d" stroke-width="1.3"/>
<text x="175.0" y="245.6" font-size="10.8" font-weight="400" fill="#1f2933" text-anchor="middle">Reflection: the re-radiated waves add up</text>
<text x="175.0" y="260.2" font-size="10.8" font-weight="400" fill="#1f2933" text-anchor="middle">backward (mirrors, shiny metals) · Ch 6</text>
<path d="M14,210 L14,249.0 L20,249.0" fill="none" stroke="#2e6fdb" stroke-width="1.4"/>
<rect x="22" y="280" width="306" height="42" rx="7" fill="#ffffff" stroke="#52606d" stroke-width="1.3"/>
<text x="175.0" y="297.6" font-size="10.8" font-weight="400" fill="#1f2933" text-anchor="middle">Transmission &amp; refraction: they add up forward</text>
<text x="175.0" y="312.2" font-size="10.8" font-weight="400" fill="#1f2933" text-anchor="middle">with a slower phase speed (glass) · Ch 6</text>
<path d="M14,210 L14,301.0 L20,301.0" fill="none" stroke="#2e6fdb" stroke-width="1.4"/>
<rect x="22" y="332" width="306" height="42" rx="7" fill="#ffffff" stroke="#52606d" stroke-width="1.3"/>
<text x="175.0" y="349.6" font-size="10.8" font-weight="400" fill="#1f2933" text-anchor="middle">Scattering: small particles send light sideways</text>
<text x="175.0" y="364.2" font-size="10.8" font-weight="400" fill="#1f2933" text-anchor="middle">(blue sky, white clouds) · Ch 7–8</text>
<path d="M14,210 L14,353.0 L20,353.0" fill="none" stroke="#2e6fdb" stroke-width="1.4"/>
<rect x="366" y="228" width="306" height="42" rx="7" fill="#ffffff" stroke="#52606d" stroke-width="1.3"/>
<text x="519.0" y="245.6" font-size="10.8" font-weight="400" fill="#1f2933" text-anchor="middle">Re-emitted after a delay in a random direction</text>
<text x="519.0" y="260.2" font-size="10.8" font-weight="400" fill="#1f2933" text-anchor="middle">(fluorescence, glow-in-the-dark) · Ch 5</text>
<path d="M358,210 L358,249.0 L364,249.0" fill="none" stroke="#d1495b" stroke-width="1.4"/>
<rect x="366" y="280" width="306" height="42" rx="7" fill="#ffffff" stroke="#52606d" stroke-width="1.3"/>
<text x="519.0" y="297.6" font-size="10.8" font-weight="400" fill="#1f2933" text-anchor="middle">Shared into atomic vibrations: becomes heat</text>
<text x="519.0" y="312.2" font-size="10.8" font-weight="400" fill="#1f2933" text-anchor="middle">(black car in the sun, IR warmth) · Ch 9</text>
<path d="M358,210 L358,301.0 L364,301.0" fill="none" stroke="#d1495b" stroke-width="1.4"/>
<rect x="366" y="332" width="306" height="42" rx="7" fill="#ffffff" stroke="#52606d" stroke-width="1.3"/>
<text x="519.0" y="349.6" font-size="10.8" font-weight="400" fill="#1f2933" text-anchor="middle">Drives chemistry: vision, photosynthesis,</text>
<text x="519.0" y="364.2" font-size="10.8" font-weight="400" fill="#1f2933" text-anchor="middle">sunburn · Ch 7, 10</text>
<path d="M358,210 L358,353.0 L364,353.0" fill="none" stroke="#d1495b" stroke-width="1.4"/>
<rect x="366" y="384" width="306" height="42" rx="7" fill="#ffffff" stroke="#52606d" stroke-width="1.3"/>
<text x="519.0" y="401.6" font-size="10.8" font-weight="400" fill="#1f2933" text-anchor="middle">If hf exceeds the ionization energy, an electron</text>
<text x="519.0" y="416.2" font-size="10.8" font-weight="400" fill="#1f2933" text-anchor="middle">is knocked out: ionization · Ch 2, 10</text>
<path d="M358,210 L358,405.0 L364,405.0" fill="none" stroke="#d1495b" stroke-width="1.4"/>
<text x="340.0" y="458" font-size="10.5" fill="#52606d" text-anchor="middle">Most real materials do several of these at once; the mix depends on wavelength. Energy is conserved: R + A + T = 1.</text>
</svg>