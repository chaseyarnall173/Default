<text x="557" y="62" font-size="11" fill="#1f2933">Make the collector</text>
<text x="557" y="78" font-size="11" fill="#1f2933">negative and raise V</text>
<text x="557" y="94" font-size="11" fill="#1f2933">until the current</text>
<text x="557" y="110" font-size="11" fill="#1f2933">stops. That stopping</text>
<text x="557" y="126" font-size="11" fill="#1f2933">voltage, V(s), gives</text>
<text x="557" y="142" font-size="11" fill="#1f2933">the fastest electrons'</text>
<text x="557" y="158" font-size="11" fill="#1f2933">kinetic energy:</text>
<text x="610" y="194" font-size="13.5" font-weight="700" fill="#1f2933" text-anchor="middle">KE<tspan dy="4" font-size="10">max</tspan><tspan dy="-4"> = eV</tspan><tspan dy="4" font-size="10">s</tspan></text>
