<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" font-family="Inter, sans-serif">
<rect width="680" height="330" fill="white"/>
<defs><marker id="mA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e09f1f"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa5b1"/></marker><linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c9d0d8"/><stop offset="0.35" stop-color="#f4f6f8"/><stop offset="0.6" stop-color="#d4dae1"/><stop offset="1" stop-color="#aeb7c1"/></linearGradient></defs>
<text x="14.0" y="20.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="600" font-style="normal">(a) A shiny pan looks cold</text>
<rect x="14" y="40" width="16" height="230" fill="#eef4fd" stroke="#2e6fdb" stroke-opacity="0.4"/>
<text x="36.0" y="50.0" font-size="11" text-anchor="start" fill="#2e6fdb" font-weight="400" font-style="normal">room, 20 °C</text>
<path d="M70 205 L250 205 L240 255 Q160.0 263 80 255 Z" fill="url(#metal)" stroke="#52606d" stroke-width="1.2"/>
<rect x="250" y="211" width="70" height="9" rx="4" fill="#52606d"/>
<rect x="185" y="206" width="34" height="47" fill="#1f2933"/>
<text x="202.0" y="281.0" font-size="11" text-anchor="middle" fill="#1f2933" font-weight="600" font-style="normal">black tape</text>
<text x="110.0" y="281.0" font-size="11" text-anchor="middle" fill="#1f2933" font-weight="600" font-style="normal">bare metal</text>
<text x="122.0" y="235.0" font-size="11.5" text-anchor="middle" fill="#1f2933" font-weight="600" font-style="normal">pan at 80 °C</text>
<rect x="282" y="57" width="48" height="30" rx="5" fill="#3e4c59"/>
<circle cx="282" cy="72" r="8" fill="#1f2933" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="306.0" y="50.0" font-size="11" text-anchor="middle" fill="#52606d" font-weight="400" font-style="normal">thermal camera</text>
<line x1="202.0" y1="203.0" x2="282.0" y2="98.0" stroke="#e09f1f" stroke-width="4.5" marker-end="url(#mA)"/>
<line x1="118.0" y1="203.0" x2="280.0" y2="92.0" stroke="#e09f1f" stroke-width="1.0" marker-end="url(#mA)"/>
<line x1="30.0" y1="150.0" x2="112.0" y2="201.0" stroke="#9aa5b1" stroke-width="2.2" stroke-dasharray="5 3" />
<line x1="112.0" y1="201.0" x2="278.0" y2="86.0" stroke="#9aa5b1" stroke-width="2.2" stroke-dasharray="5 3" marker-end="url(#mG)"/>
<text x="244.0" y="172.0" font-size="11" text-anchor="start" fill="#e09f1f" font-weight="600" font-style="normal">tape emits</text>
<text x="244.0" y="186.0" font-size="11" text-anchor="start" fill="#e09f1f" font-weight="600" font-style="normal">strongly</text>
<text x="244.0" y="200.0" font-size="11" text-anchor="start" fill="#e09f1f" font-weight="400" font-style="normal">(ε ≈ 0.95)</text>
<text x="40.0" y="108.0" font-size="11" text-anchor="start" fill="#52606d" font-weight="600" font-style="normal">metal mostly reflects</text>
<text x="40.0" y="122.0" font-size="11" text-anchor="start" fill="#52606d" font-weight="600" font-style="normal">the cool room</text>
<text x="40.0" y="136.0" font-size="11" text-anchor="start" fill="#52606d" font-weight="400" font-style="normal">(ε ≈ 0.05)</text>
<rect x="246" y="262" width="108" height="50" rx="6" fill="#1f2933"/>
<text x="255.0" y="281.0" font-size="11.5" text-anchor="start" fill="#ffd27a" font-weight="600" font-style="normal">tape:   80 °C</text>
<text x="255.0" y="300.0" font-size="11.5" text-anchor="start" fill="#9ec5ff" font-weight="600" font-style="normal">metal: ≈ 24 °C</text>
<text x="368.0" y="20.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="600" font-style="normal">(b) Glass: clear to eyes, a wall to the camera</text>
<rect x="512" y="45" width="12" height="230" fill="#dfeaf3" stroke="#52606d" stroke-width="1"/>
<text x="518.0" y="292.0" font-size="11" text-anchor="middle" fill="#52606d" font-weight="400" font-style="normal">window glass</text>
<circle cx="640" cy="105" r="17" fill="#f2c4a8" stroke="#52606d" stroke-width="1"/>
<path d="M614 250 Q612 135 640 128 Q668 135 666 250 Z" fill="#f2c4a8" stroke="#52606d" stroke-width="1"/>
<text x="626.0" y="270.0" font-size="11" text-anchor="middle" fill="#1f2933" font-weight="400" font-style="normal">person, 34 °C skin</text>
<path d="M384 80 Q400 68 416 80 Q400 92 384 80 Z" fill="white" stroke="#1f2933" stroke-width="1.2"/>
<circle cx="402" cy="80" r="4.5" fill="#1f2933"/>
<text x="400.0" y="106.0" font-size="11" text-anchor="middle" fill="#52606d" font-weight="400" font-style="normal">your eye</text>
<line x1="620.0" y1="95.0" x2="422.0" y2="80.0" stroke="#e09f1f" stroke-width="2.5" marker-end="url(#mA)"/>
<text x="532.0" y="72.0" font-size="11" text-anchor="start" fill="#e09f1f" font-weight="600" font-style="normal">visible light</text>
<text x="532.0" y="86.0" font-size="11" text-anchor="start" fill="#e09f1f" font-weight="600" font-style="normal">passes</text>
<line x1="614.0" y1="175.0" x2="526.0" y2="175.0" stroke="#d1495b" stroke-width="3" marker-end="url(#mR)"/>
<text x="530.0" y="151.0" font-size="11" text-anchor="start" fill="#d1495b" font-weight="600" font-style="normal">IR (8–14 µm)</text>
<text x="530.0" y="165.0" font-size="11" text-anchor="start" fill="#d1495b" font-weight="600" font-style="normal">absorbed</text>
<rect x="386" y="175" width="48" height="30" rx="5" fill="#3e4c59"/>
<circle cx="434" cy="190" r="8" fill="#1f2933" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="410.0" y="220.0" font-size="11" text-anchor="middle" fill="#52606d" font-weight="400" font-style="normal">thermal camera</text>
<line x1="510.0" y1="190.0" x2="446.0" y2="190.0" stroke="#9aa5b1" stroke-width="2.2" stroke-dasharray="5 3" marker-end="url(#mG)"/>
<text x="452.0" y="236.0" font-size="11" text-anchor="start" fill="#52606d" font-weight="400" font-style="normal">camera sees only the</text>
<text x="452.0" y="250.0" font-size="11" text-anchor="start" fill="#52606d" font-weight="400" font-style="normal">glass’s own glow and</text>
<text x="452.0" y="264.0" font-size="11" text-anchor="start" fill="#52606d" font-weight="400" font-style="normal">reflections</text>
</svg>
