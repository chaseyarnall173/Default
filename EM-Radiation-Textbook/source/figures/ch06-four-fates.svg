<rect x="488" y="112" width="178" height="150" rx="8" fill="#f5f7fa" stroke="#c4ccd5"/>
<text x="577.0" y="146" font-size="21" fill="#1f2933" text-anchor="middle" font-weight="700">R + A + T = 1</text>
<text x="502" y="176" font-size="12" fill="#1f2933" text-anchor="start" font-weight="400">R = fraction reflected</text>
<text x="502" y="195" font-size="12" fill="#1f2933" text-anchor="start" font-weight="400">A = fraction absorbed</text>
<text x="502" y="214" font-size="12" fill="#1f2933" text-anchor="start" font-weight="400">T = fraction transmitted</text>
<text x="502" y="233" font-size="12" fill="#52606d" text-anchor="start" font-weight="400">Arrow thickness = energy</text>
