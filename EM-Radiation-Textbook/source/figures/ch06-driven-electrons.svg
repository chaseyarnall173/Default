<text x="386.0" y="52.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="600">transmitted wave = incoming + forward</text>
<text x="386.0" y="67.0" font-size="12" fill="#52606d" text-anchor="start" font-weight="400">re-radiation; crests arrive a bit late</text>
<text x="640.0" y="148.0" font-size="11" fill="#52606d" text-anchor="end" font-weight="400">dashed: same wave with no material</text>
<text x="386.0" y="182.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="400">electrons are forced to oscillate at</text>
<text x="386.0" y="197.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="400">exactly the light's frequency, in lockstep;</text>
<text x="386.0" y="212.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="400">each radiates like a tiny antenna</text>
<text x="386.0" y="227.0" font-size="12" fill="#52606d" text-anchor="start" font-weight="400">(no waiting, no change of color)</text>
