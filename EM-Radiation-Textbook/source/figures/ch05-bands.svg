<text x="460.0" y="283" font-size="10" fill="#1f2933" text-anchor="middle">(filled)</text>
<text x="460.0" y="178.5" font-size="10" fill="#1f2933" text-anchor="middle">conduction band</text>
<text x="460.0" y="191.5" font-size="10" fill="#1f2933" text-anchor="middle">(empty)</text>
