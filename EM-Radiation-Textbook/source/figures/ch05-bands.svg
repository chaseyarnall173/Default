<text x="598.0" y="86.5" font-size="10" fill="#1f2933" text-anchor="middle">conduction band</text>
<text x="598.0" y="99.5" font-size="10" fill="#1f2933" text-anchor="middle">(empty)</text>
<line x1="644" y1="115.5" x2="644" y2="229" stroke="#52606d" stroke-width="1.1" marker-start="url(#gr)" marker-end="url(#gr)"/>
<text x="639" y="176.2" font-size="10.5" font-weight="700" fill="#1f2933" text-anchor="end">≈ 5.5 eV</text>
<text x="266" y="322" font-size="10" fill="#1f2933">Partly filled band: tiny</text>
<text x="266" y="335" font-size="10" fill="#1f2933">energies lift electrons,</text>
<text x="266" y="348" font-size="10" fill="#1f2933">so it conducts and</text>
<text x="266" y="361" font-size="10" fill="#1f2933">reflects visible light</text>
<text x="266" y="374" font-size="10" fill="#1f2933">(Chapter 6).</text>
<text x="404" y="322" font-size="10" fill="#1f2933">Small gap (Si 1.12,</text>
<text x="404" y="335" font-size="10" fill="#1f2933">GaAs 1.42 eV). Photons</text>
<text x="404" y="348" font-size="10" fill="#1f2933">with E ≥ Eg absorbed;</text>
<text x="404" y="361" font-size="10" fill="#1f2933">an electron falling back</text>
<text x="404" y="374" font-size="10" fill="#1f2933">gives LED light, E ≈ Eg.</text>
<text x="542" y="322" font-size="10" fill="#1f2933">Wide gap (diamond 5.5,</text>
<text x="542" y="335" font-size="10" fill="#1f2933">Al₂O₃ ≈ 8.8 eV). Visible</text>
<text x="542" y="348" font-size="10" fill="#1f2933">photons can’t bridge it:</text>
<text x="542" y="361" font-size="10" fill="#1f2933">transparent and</text>
<text x="542" y="374" font-size="10" fill="#1f2933">non-conducting.</text>
<text x="404" y="144.5" font-size="10" fill="#52606d">gaps drawn to the same scale</text>
