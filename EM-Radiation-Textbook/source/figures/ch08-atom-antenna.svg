<text x="82.0" y="326.0" font-size="10.5" text-anchor="middle" fill="#52606d" font-weight="400" font-style="normal">electron cloud pushed up</text>
<text x="158.0" y="232.0" font-size="11.5" text-anchor="start" fill="#1f2933" font-weight="400" font-style="normal">Zoomed in on the atom: the field is</text>
<text x="158.0" y="247.5" font-size="11.5" text-anchor="start" fill="#1f2933" font-weight="400" font-style="normal">the same across the whole atom (it</text>
<text x="158.0" y="263.0" font-size="11.5" text-anchor="start" fill="#1f2933" font-weight="400" font-style="normal">varies by only ~0.1%). It pushes the</text>
<text x="158.0" y="278.5" font-size="11.5" text-anchor="start" fill="#1f2933" font-weight="400" font-style="normal">electron cloud one way, then the other:</text>
<text x="158.0" y="294.0" font-size="11.5" text-anchor="start" fill="#1f2933" font-weight="400" font-style="normal">an oscillating dipole, the first step</text>
<text x="158.0" y="309.5" font-size="11.5" text-anchor="start" fill="#1f2933" font-weight="400" font-style="normal">in absorbing (or emitting) light.</text>
<text x="418.0" y="22.0" font-size="13" text-anchor="start" fill="#1f2933" font-weight="600" font-style="normal">(b) Antennas: length sets efficiency</text>
