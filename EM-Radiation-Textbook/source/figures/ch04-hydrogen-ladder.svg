<text x="54" y="70.0" font-size="10" fill="#52606d" text-anchor="end">0</text>
<line x1="58" y1="126.0" x2="62" y2="126.0" stroke="#52606d"/>
<text x="54" y="130.0" font-size="10" fill="#52606d" text-anchor="end">-1</text>
<line x1="58" y1="186.0" x2="62" y2="186.0" stroke="#52606d"/>
<text x="54" y="190.0" font-size="10" fill="#52606d" text-anchor="end">-2</text>
<line x1="58" y1="246.0" x2="62" y2="246.0" stroke="#52606d"/>
<text x="54" y="250.0" font-size="10" fill="#52606d" text-anchor="end">-3</text>
<line x1="58" y1="352" x2="62" y2="352" stroke="#52606d"/>
<text x="54" y="356" font-size="10" fill="#52606d" text-anchor="end">−13.6</text>
<text x="20" y="200" font-size="10.5" fill="#52606d" text-anchor="middle" transform="rotate(-90 20 200)">energy (eV)</text>
<line x1="92" y1="352.0" x2="326" y2="352.0" stroke="#1f2933" stroke-width="2.4"/>
<line x1="92" y1="270.0" x2="326" y2="270.0" stroke="#1f2933" stroke-width="1.8"/>
<line x1="92" y1="156.7" x2="326" y2="156.7" stroke="#1f2933" stroke-width="1.8"/>
<line x1="92" y1="117.0" x2="326" y2="117.0" stroke="#1f2933" stroke-width="1.8"/>
<line x1="92" y1="98.6" x2="326" y2="98.6" stroke="#1f2933" stroke-width="1.8"/>
<line x1="92" y1="88.7" x2="326" y2="88.7" stroke="#1f2933" stroke-width="1.8"/>
<line x1="92" y1="66" x2="326" y2="66" stroke="#1f2933" stroke-width="1.2" stroke-dasharray="5 3"/>
<path d="M328 66.0 L338 60.0" stroke="#52606d" stroke-width="0.8" fill="none"/>
<text x="341" y="64.0" font-size="11" font-weight="700" fill="#1f2933">n = ∞</text>
<text x="386" y="64.0" font-size="11" fill="#1f2933">0 eV</text>
<path d="M328 88.7 L338 80.0" stroke="#52606d" stroke-width="0.8" fill="none"/>
<text x="341" y="84.0" font-size="11" font-weight="700" fill="#1f2933">n = 6</text>
<text x="386" y="84.0" font-size="11" fill="#1f2933">−0.38 eV</text>
<path d="M328 98.6 L338 95.0" stroke="#52606d" stroke-width="0.8" fill="none"/>
<text x="341" y="99.0" font-size="11" font-weight="700" fill="#1f2933">n = 5</text>
<text x="386" y="99.0" font-size="11" fill="#1f2933">−0.54 eV</text>
<path d="M328 117.0 L338 117.0" stroke="#52606d" stroke-width="0.8" fill="none"/>
<text x="341" y="121.0" font-size="11" font-weight="700" fill="#1f2933">n = 4</text>
<text x="386" y="121.0" font-size="11" fill="#1f2933">−0.85 eV</text>
<path d="M328 156.7 L338 156.7" stroke="#52606d" stroke-width="0.8" fill="none"/>
<text x="341" y="160.7" font-size="11" font-weight="700" fill="#1f2933">n = 3</text>
<text x="386" y="160.7" font-size="11" fill="#1f2933">−1.51 eV</text>
<path d="M328 270.0 L338 270.0" stroke="#52606d" stroke-width="0.8" fill="none"/>
<text x="341" y="274.0" font-size="11" font-weight="700" fill="#1f2933">n = 2</text>
<text x="386" y="274.0" font-size="11" fill="#1f2933">−3.40 eV</text>
<path d="M328 352.0 L338 352.0" stroke="#52606d" stroke-width="0.8" fill="none"/>
<text x="341" y="356.0" font-size="11" font-weight="700" fill="#1f2933">n = 1</text>
<text x="386" y="356.0" font-size="11" fill="#1f2933">−13.6 eV</text>
<text x="341" y="371" font-size="10.5" fill="#0b6e4f" font-weight="600">ground state</text>
<text x="341" y="289.0" font-size="10.5" fill="#52606d">first excited state</text>
<line x1="108" y1="350.0" x2="108" y2="272.0" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="114" y="333.0" font-size="11" font-weight="700" fill="#1f2933" text-anchor="start">10.2 eV</text>
<text x="114" y="346.0" font-size="10" fill="#52606d" text-anchor="start">1 → 2</text>
<line x1="146" y1="268.0" x2="146" y2="158.7" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="152" y="213.3" font-size="11" font-weight="700" fill="#1f2933" text-anchor="start">1.89 eV</text>
<text x="152" y="226.3" font-size="10" fill="#52606d" text-anchor="start">2 → 3</text>
<line x1="196" y1="268.0" x2="196" y2="68.0" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="202" y="168.0" font-size="11" font-weight="700" fill="#1f2933" text-anchor="start">3.40 eV</text>
<text x="202" y="181.0" font-size="10" fill="#52606d" text-anchor="start">ionize from n = 2</text>
<line x1="306" y1="350.0" x2="306" y2="68.0" stroke="#1f2933" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="300" y="333.0" font-size="11" font-weight="700" fill="#1f2933" text-anchor="end">13.6 eV</text>
<text x="300" y="346.0" font-size="10" fill="#52606d" text-anchor="end">ionize from n = 1</text>
<rect x="62" y="302" width="264" height="10" fill="#ffffff"/>
<path d="M56 300 L68 306 M56 308 L68 314" stroke="#52606d" stroke-width="1.2"/>
<rect x="466" y="40" width="206" height="300" rx="8" fill="#f5f7fa"/>
<text x="478" y="68" font-size="15" font-weight="700" fill="#1f2933">Eₙ = −13.6 eV / n²</text>
<text x="478" y="96" font-size="11" font-weight="700" fill="#1f2933">Negative means bound:</text>
<text x="478" y="110" font-size="10.5" fill="#52606d">you must add energy to free</text>
<text x="478" y="124" font-size="10.5" fill="#52606d">the electron (0 eV = free, at rest).</text>
<text x="478" y="156" font-size="11" font-weight="700" fill="#1f2933">Gaps shrink as n grows:</text>
<text x="478" y="170" font-size="10.5" fill="#52606d">levels crowd together just</text>
<text x="478" y="184" font-size="10.5" fill="#52606d">below 0 eV.</text>
<text x="478" y="216" font-size="11" font-weight="700" fill="#1f2933">Higher n = bigger cloud:</text>
<text x="478" y="230" font-size="10.5" fill="#52606d">in the Bohr model the radius</text>
<text x="478" y="244" font-size="10.5" fill="#52606d">grows as n² (n = 2 is 4× wider).</text>
<text x="478" y="276" font-size="11" font-weight="700" fill="#1f2933">Every jump has an exact size:</text>
<text x="478" y="290" font-size="10.5" fill="#52606d">only photons carrying exactly</text>
<text x="478" y="304" font-size="10.5" fill="#52606d">that energy can cause it (Ch. 5).</text>
</svg>