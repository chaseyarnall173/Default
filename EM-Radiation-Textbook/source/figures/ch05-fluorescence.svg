<text x="14" y="324" font-size="10.5" fill="#1f2933"><tspan font-weight="700">Fluorescence</tspan> (solid arrows): emission within ~ns; stops when the UV stops.</text>
<text x="14" y="340" font-size="10.5" fill="#1f2933"><tspan font-weight="700">Phosphorescence</tspan> (dashed): electron parked in a stuck state;</text>
<text x="14" y="354" font-size="10.5" fill="#1f2933">leaks out over seconds to hours (glow-in-the-dark).</text>
<text x="420" y="24" font-size="12" font-weight="700" fill="#1f2933">The Stokes shift (schematic)</text>
<text x="420" y="39" font-size="10" fill="#52606d">emitted light is redder than absorbed light</text>
