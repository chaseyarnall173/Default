<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" width="680" height="270" font-family="Inter, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
  <marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6fdb"/></marker>
</defs>
<!-- left box: changing E -->
<rect x="40" y="46" width="220" height="74" rx="10" fill="#fbeef0" stroke="#d1495b" stroke-width="1.8"/>
<text x="150" y="76" font-size="15" font-weight="700" fill="#d1495b" text-anchor="middle">A changing E field</text>
<text x="150" y="96" font-size="12" fill="#1f2933" text-anchor="middle">creates a B field</text>
<text x="150" y="111" font-size="11" fill="#52606d" text-anchor="middle">(Maxwell, 1865)</text>
<!-- right box: changing B -->
<rect x="420" y="46" width="220" height="74" rx="10" fill="#edf3fd" stroke="#2e6fdb" stroke-width="1.8"/>
<text x="530" y="76" font-size="15" font-weight="700" fill="#2e6fdb" text-anchor="middle">A changing B field</text>
<text x="530" y="96" font-size="12" fill="#1f2933" text-anchor="middle">creates an E field</text>
<text x="530" y="111" font-size="11" fill="#52606d" text-anchor="middle">(Faraday, 1831; how generators work)</text>
<!-- cycle arrows -->
<path d="M200,44 C260,18 420,18 478,44" fill="none" stroke="#d1495b" stroke-width="2" marker-end="url(#ar)"/>
<text x="340" y="16" font-size="12" fill="#52606d" text-anchor="middle">which is itself changing, so…</text>
<path d="M480,122 C420,150 260,150 202,122" fill="none" stroke="#2e6fdb" stroke-width="2" marker-end="url(#ab)"/>
<text x="340" y="168" font-size="12" fill="#52606d" text-anchor="middle">…which is itself changing, so…</text>
<text x="340" y="80" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">self-sustaining</text>
<text x="340" y="97" font-size="12" fill="#52606d" text-anchor="middle">no charges or</text>
<text x="340" y="112" font-size="12" fill="#52606d" text-anchor="middle">medium needed</text>
<!-- marching strip -->
<line x1="30" y1="186" x2="650" y2="186" stroke="#d9dee5" stroke-width="1"/>
<text x="30" y="210" font-size="12" fill="#1f2933">Each new field appears a little farther along, so the pair marches forward through empty space:</text>
<g font-size="15" font-weight="700" text-anchor="middle">
  <text x="60" y="246" fill="#d1495b">E</text>
  <text x="130" y="246" fill="#2e6fdb">B</text>
  <text x="200" y="246" fill="#d1495b">E</text>
  <text x="270" y="246" fill="#2e6fdb">B</text>
  <text x="340" y="246" fill="#d1495b">E</text>
</g>
<g stroke="#52606d" stroke-width="1.4">
  <line x1="72" y1="241" x2="114" y2="241" marker-end="url(#ai)"/>
  <line x1="142" y1="241" x2="184" y2="241" marker-end="url(#ai)"/>
  <line x1="212" y1="241" x2="254" y2="241" marker-end="url(#ai)"/>
  <line x1="282" y1="241" x2="324" y2="241" marker-end="url(#ai)"/>
  <line x1="352" y1="241" x2="394" y2="241" marker-end="url(#ai)"/>
</g>
<text x="410" y="246" font-size="13" fill="#1f2933">at speed c = 1/√(μ₀ε₀) = 3.00 × 10⁸ m/s</text>
</svg>
