<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="Inter, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e09f1f"/></marker>
</defs>
<!-- ===== (a) a polarizer ===== -->
<text x="16" y="24" font-size="13" font-weight="700" fill="#1f2933">(a) A polarizer passes one direction of E</text>
<line x1="20" y1="150" x2="320" y2="150" stroke="#e09f1f" stroke-width="3" marker-end="url(#aa)"/>
<!-- unpolarized: E arrows in many directions -->
<g stroke="#d1495b" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)">
  <line x1="70" y1="118" x2="70" y2="182"/>
  <line x1="38" y1="150" x2="102" y2="150"/>
  <line x1="47.4" y1="127.4" x2="92.6" y2="172.6"/>
  <line x1="47.4" y1="172.6" x2="92.6" y2="127.4"/>
  <line x1="57.8" y1="120.4" x2="82.2" y2="179.6"/>
  <line x1="40.4" y1="137.8" x2="99.6" y2="162.2"/>
</g>
<text x="70" y="208" font-size="12" fill="#1f2933" text-anchor="middle">unpolarized</text>
<text x="70" y="223" font-size="11" fill="#52606d" text-anchor="middle">E points every which way</text>
<!-- polarizer sheet in perspective -->
<polygon points="150,78 186,58 186,222 150,242" fill="#d9dee5" fill-opacity="0.85" stroke="#52606d" stroke-width="1.3"/>
<g stroke="#52606d" stroke-width="1">
  <line x1="156" y1="75" x2="156" y2="239"/><line x1="162" y1="71" x2="162" y2="235"/>
  <line x1="168" y1="68" x2="168" y2="232"/><line x1="174" y1="65" x2="174" y2="229"/>
  <line x1="180" y1="61" x2="180" y2="225"/>
</g>
<text x="168" y="262" font-size="12" fill="#1f2933" text-anchor="middle">polarizer</text>
<text x="168" y="277" font-size="11" fill="#52606d" text-anchor="middle">transmission axis</text>
<text x="168" y="291" font-size="11" fill="#52606d" text-anchor="middle">vertical</text>
<!-- polarized output -->
<g stroke="#d1495b" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)">
  <line x1="236" y1="124" x2="236" y2="176"/>
  <line x1="276" y1="124" x2="276" y2="176"/>
</g>
<text x="256" y="208" font-size="12" fill="#1f2933" text-anchor="middle">vertically polarized</text>
<text x="256" y="223" font-size="11" fill="#52606d" text-anchor="middle">half the intensity</text>
<line x1="340" y1="14" x2="340" y2="306" stroke="#d9dee5" stroke-width="1"/>
<!-- ===== (b) glare and sunglasses ===== -->
<text x="356" y="24" font-size="13" font-weight="700" fill="#1f2933">(b) Polarized sunglasses block glare</text>
<!-- sun -->
<circle cx="392" cy="70" r="16" fill="#f2c14e" stroke="#e09f1f" stroke-width="1.5"/>
<!-- water -->
<rect x="350" y="228" width="320" height="56" fill="#dbe7f6"/>
<line x1="350" y1="228" x2="670" y2="228" stroke="#52606d" stroke-width="1.3"/>
<text x="362" y="272" font-size="12" fill="#52606d">water or a wet road</text>
<!-- incoming ray -->
<line x1="404" y1="84" x2="498" y2="226" stroke="#e09f1f" stroke-width="3" marker-end="url(#aa)"/>
<!-- reflected ray to sunglasses -->
<line x1="500" y1="228" x2="594" y2="114" stroke="#e09f1f" stroke-width="3"/>
<!-- horizontal E on the reflected ray, drawn as short double arrows parallel to the water surface (perspective) -->
<g stroke="#d1495b" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)">
  <line x1="509" y1="208" x2="545" y2="196"/>
  <line x1="530" y1="183" x2="566" y2="171"/>
  <line x1="551" y1="158" x2="587" y2="146"/>
</g>
<text x="612" y="182" font-size="12" fill="#1f2933">glare: E</text>
<text x="612" y="197" font-size="12" fill="#1f2933">mostly</text>
<text x="612" y="212" font-size="12" fill="#1f2933">horizontal</text>
<!-- sunglasses lens with vertical axis -->
<ellipse cx="606" cy="98" rx="20" ry="28" fill="#5c6670" fill-opacity="0.35" stroke="#1f2933" stroke-width="2"/>
<g stroke="#1f2933" stroke-width="1" stroke-opacity="0.7">
  <line x1="596" y1="74" x2="596" y2="122"/><line x1="606" y1="70" x2="606" y2="126"/><line x1="616" y1="74" x2="616" y2="122"/>
</g>
<text x="634" y="58" font-size="11.5" fill="#1f2933" text-anchor="end">lens axis vertical</text>
<!-- blocked mark -->
<g stroke="#c2410c" stroke-width="3" stroke-linecap="round">
  <line x1="640" y1="88" x2="660" y2="108"/><line x1="660" y1="88" x2="640" y2="108"/>
</g>
<text x="662" y="140" font-size="12" fill="#c2410c" font-weight="700" text-anchor="end">blocked</text>
<text x="420" y="130" font-size="11.5" fill="#52606d">sunlight:</text>
<text x="420" y="145" font-size="11.5" fill="#52606d">unpolarized</text>
</svg>
