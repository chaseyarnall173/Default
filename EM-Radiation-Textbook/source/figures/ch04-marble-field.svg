<line x1="22" y1="368" x2="121.0" y2="368" stroke="#1f2933" stroke-width="2"/>
<line x1="22" y1="363" x2="22" y2="373" stroke="#1f2933" stroke-width="1.2"/><line x1="121.0" y1="363" x2="121.0" y2="373" stroke="#1f2933" stroke-width="1.2"/>
<text x="127.0" y="372" font-size="10.5" fill="#52606d">300 m</text>
<text x="16" y="32" font-size="10" fill="#52606d">no hard edge:</text>
<text x="16" y="45" font-size="10" fill="#52606d">shading just fades</text>
<text x="404" y="34" font-size="11.5" font-weight="700" fill="#1f2933">If the nucleus were a 1.5 cm marble,</text>
<text x="404" y="49" font-size="11.5" font-weight="700" fill="#1f2933">the electron cloud would be:</text>
<text x="480" y="92" font-size="11" fill="#1f2933" text-anchor="end">Hydrogen</text>
<rect x="488" y="82" width="143.6" height="14" rx="3" fill="#12a39a"/>
<text x="636.6" y="93" font-size="11" font-weight="600" fill="#1f2933">945 m</text>
<text x="480" y="122" font-size="11" fill="#1f2933" text-anchor="end">Carbon</text>
<rect x="488" y="112" width="58.9" height="14" rx="3" fill="#12a39a"/>
<text x="551.9" y="123" font-size="11" font-weight="600" fill="#1f2933">388 m</text>
<text x="480" y="152" font-size="11" fill="#1f2933" text-anchor="end">Iron</text>
<rect x="488" y="142" width="61.6" height="14" rx="3" fill="#12a39a"/>
<text x="554.6" y="153" font-size="11" font-weight="600" fill="#1f2933">405 m</text>
<text x="480" y="182" font-size="11" fill="#1f2933" text-anchor="end">Gold</text>
<rect x="488" y="172" width="47.0" height="14" rx="3" fill="#12a39a"/>
<text x="540.0" y="183" font-size="11" font-weight="600" fill="#1f2933">309 m</text>
<text x="480" y="212" font-size="11" fill="#1f2933" text-anchor="end">Football field</text>
<rect x="488" y="202" width="16.7" height="14" rx="3" fill="#0b6e4f"/>
<text x="509.7" y="213" font-size="11" font-weight="600" fill="#1f2933">110 m</text>
<line x1="488" y1="74" x2="488" y2="224" stroke="#52606d" stroke-width="1"/>
<text x="488.0" y="238" font-size="10" fill="#52606d" text-anchor="middle">0 m</text>
<text x="564.0" y="238" font-size="10" fill="#52606d" text-anchor="middle">500 m</text>
<text x="640.0" y="238" font-size="10" fill="#52606d" text-anchor="middle">1,000 m</text>
<text x="404" y="270" font-size="10.5" fill="#52606d">Heavier atoms have bigger nuclei, so</text>
<text x="404" y="285" font-size="10.5" fill="#52606d">their ratio is smaller, but every cloud</text>
<text x="404" y="300" font-size="10.5" fill="#52606d">is still several fields across.</text>
<text x="404" y="315" font-size="10.5" fill="#52606d"></text>
<text x="404" y="330" font-size="10.5" fill="#52606d">Fraction of the atom’s volume</text>
<text x="404" y="345" font-size="10.5" fill="#52606d">filled by the nucleus: less than</text>
<text x="404" y="360" font-size="10.5" fill="#52606d">one part in a trillion (10⁻¹²).</text>
</svg>