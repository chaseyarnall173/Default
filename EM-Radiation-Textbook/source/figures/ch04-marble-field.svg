<text x="212" y="281" font-size="10.5" fill="#1f2933">size here: 1/200 pixel)</text>
<line x1="181.9" y1="204.1" x2="162.0" y2="254.0" stroke="#1f2933" stroke-width="0.9"/>
<text x="172.0" y="268.0" font-size="10.5" fill="#1f2933" text-anchor="end">football field</text>
