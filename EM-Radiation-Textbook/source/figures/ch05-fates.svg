<text x="18" y="252" font-size="10.3" fill="#1f2933">Surface electrons are shaken in</text>
<text x="18" y="265" font-size="10.3" fill="#1f2933">step by the wave and re-radiate</text>
<text x="18" y="278" font-size="10.3" fill="#1f2933">together: one beam, at the mirror</text>
<text x="18" y="291" font-size="10.3" fill="#1f2933">angle, no delay, same color.</text>
<text x="18" y="304" font-size="10.3" fill="#52606d"></text>
<text x="18" y="317" font-size="10.3" fill="#52606d">The energy is passed straight</text>
<text x="18" y="330" font-size="10.3" fill="#52606d">back out; nothing is kept.</text>
<text x="250" y="30" font-size="12" font-weight="700" fill="#1f2933">Absorbed: a photon with the right energy</text>
<text x="250" y="45" font-size="10.5" fill="#52606d">is swallowed whole. Then its energy has three possible fates.</text>
