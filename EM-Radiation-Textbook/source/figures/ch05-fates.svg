<text x="424" y="82" font-size="11.5" font-weight="700" fill="#1f2933">1  Re-emitted as light</text>
<text x="424" y="99" font-size="10.3" fill="#1f2933">A new photon leaves after ~ns, in a</text>
<text x="424" y="112" font-size="10.3" fill="#1f2933">random direction, out of step with</text>
<text x="424" y="125" font-size="10.3" fill="#1f2933">the original. Common in thin gases.</text>
<circle cx="390" cy="110" r="6" fill="#12a39a" opacity="0.3"/>
