<text x="300" y="239" font-size="10.5" font-weight="700" fill="#1f2933" text-anchor="middle">atom or</text>
<text x="300" y="252" font-size="10.5" font-weight="700" fill="#1f2933" text-anchor="middle">molecule</text>
