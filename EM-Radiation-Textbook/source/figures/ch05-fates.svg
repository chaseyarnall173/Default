<text x="424" y="172" font-size="11.5" font-weight="700" fill="#1f2933">2  Turned into heat</text>
<text x="424" y="189" font-size="10.3" fill="#1f2933">Collisions or atomic vibrations steal</text>
<text x="424" y="202" font-size="10.3" fill="#1f2933">the energy first: it becomes random</text>
<text x="424" y="215" font-size="10.3" fill="#1f2933">jiggling, i.e. higher temperature.</text>
