<text x="424" y="262" font-size="11.5" font-weight="700" fill="#1f2933">3  Drives chemistry</text>
<text x="424" y="279" font-size="10.3" fill="#1f2933">The energy breaks or rearranges a bond:</text>
<text x="424" y="292" font-size="10.3" fill="#1f2933">photosynthesis, vision, sunburn,</text>
<text x="424" y="305" font-size="10.3" fill="#1f2933">fading of dyes (Chapters 7 and 10).</text>
