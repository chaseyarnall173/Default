<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" font-family="Inter, sans-serif">
<defs><linearGradient id="vis" x1="0" x2="1"><stop offset="0" stop-color="#ff2a1a"/><stop offset="0.3" stop-color="#ffb000"/><stop offset="0.5" stop-color="#3ccf3c"/><stop offset="0.75" stop-color="#2a7fff"/><stop offset="1" stop-color="#7b3cff"/></linearGradient></defs>
<text x="150" y="18" font-size="11.5" font-weight="700" fill="#1f2933">Photon energy (eV, log scale)</text>
<text x="413" y="18" font-size="11.5" font-weight="700" fill="#1f2933">What it mainly does to matter</text>
<text x="8" y="18" font-size="11.5" font-weight="700" fill="#1f2933">Band</text>
<line x1="165.3" y1="44" x2="165.3" y2="332" stroke="#d9dee5" stroke-width="1"/>
<text x="165.3" y="38" font-size="10.5" fill="#52606d" text-anchor="middle">10⁻⁸</text>
<line x1="195.9" y1="44" x2="195.9" y2="332" stroke="#d9dee5" stroke-width="1"/>
<text x="195.9" y="38" font-size="10.5" fill="#52606d" text-anchor="middle">10⁻⁶</text>
<line x1="226.6" y1="44" x2="226.6" y2="332" stroke="#d9dee5" stroke-width="1"/>
<text x="226.6" y="38" font-size="10.5" fill="#52606d" text-anchor="middle">10⁻⁴</text>
<line x1="257.2" y1="44" x2="257.2" y2="332" stroke="#d9dee5" stroke-width="1"/>
<text x="257.2" y="38" font-size="10.5" fill="#52606d" text-anchor="middle">10⁻²</text>
<line x1="287.8" y1="44" x2="287.8" y2="332" stroke="#d9dee5" stroke-width="1"/>
<text x="287.8" y="38" font-size="10.5" fill="#52606d" text-anchor="middle">1</text>
<line x1="318.4" y1="44" x2="318.4" y2="332" stroke="#d9dee5" stroke-width="1"/>
<text x="318.4" y="38" font-size="10.5" fill="#52606d" text-anchor="middle">10²</text>
<line x1="349.1" y1="44" x2="349.1" y2="332" stroke="#d9dee5" stroke-width="1"/>
<text x="349.1" y="38" font-size="10.5" fill="#52606d" text-anchor="middle">10⁴</text>
<line x1="379.7" y1="44" x2="379.7" y2="332" stroke="#d9dee5" stroke-width="1"/>
<text x="379.7" y="38" font-size="10.5" fill="#52606d" text-anchor="middle">10⁶</text>
<line x1="303.1" y1="44" x2="303.1" y2="342" stroke="#d1495b" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="307.1" y="354" font-size="10.5" font-weight="700" fill="#d1495b">≈10 eV: ionizing →</text>
<text x="299.1" y="354" font-size="10.5" fill="#52606d" text-anchor="end">← non-ionizing</text>
<rect x="0" y="54" width="680" height="40" fill="#f5f7fa"/>
<rect x="150.0" y="64" width="47.4" height="18" rx="3" fill="#7a8794"/>
<text x="8" y="78" font-size="12.5" font-weight="700" fill="#1f2933">Radio</text>
<text x="413" y="71" font-size="11" fill="#1f2933">Drives currents in antennas and metal;</text>
<text x="413" y="85" font-size="11" fill="#1f2933">too weak to change atoms or molecules</text>
<rect x="197.4" y="104" width="45.9" height="18" rx="3" fill="#8f6b5a"/>
<text x="8" y="118" font-size="12.5" font-weight="700" fill="#1f2933">Microwave</text>
<text x="413" y="111" font-size="11" fill="#1f2933">Spins (rotates) polar molecules such</text>
<text x="413" y="125" font-size="11" fill="#1f2933">as water: the microwave oven</text>
<rect x="0" y="134" width="680" height="40" fill="#f5f7fa"/>
<rect x="243.3" y="144" width="48.3" height="18" rx="3" fill="#b3262e"/>
<text x="8" y="158" font-size="12.5" font-weight="700" fill="#1f2933">Infrared</text>
<text x="413" y="151" font-size="11" fill="#1f2933">Shakes chemical bonds (vibrations):</text>
<text x="413" y="165" font-size="11" fill="#1f2933">absorbed as warmth; what warm things emit</text>
<rect x="291.6" y="184" width="4.0" height="18" rx="3" fill="url(#vis)"/>
<text x="8" y="198" font-size="12.5" font-weight="700" fill="#1f2933">Visible</text>
<text x="413" y="191" font-size="11" fill="#1f2933">Lifts outer electrons across 1.8–3.1 eV gaps:</text>
<text x="413" y="205" font-size="11" fill="#1f2933">color, vision, photosynthesis, LEDs</text>
<rect x="0" y="214" width="680" height="40" fill="#f5f7fa"/>
<rect x="295.3" y="224" width="24.5" height="18" rx="3" fill="#6a4cff"/>
<text x="8" y="238" font-size="12.5" font-weight="700" fill="#1f2933">Ultraviolet</text>
<text x="413" y="231" font-size="11" fill="#1f2933">Breaks chemical bonds (sunburn); above</text>
<text x="413" y="245" font-size="11" fill="#1f2933">≈10 eV it can ionize atoms</text>
<rect x="319.9" y="264" width="45.9" height="18" rx="3" fill="#8a7fd6"/>
<text x="8" y="278" font-size="12.5" font-weight="700" fill="#1f2933">X-ray</text>
<text x="413" y="271" font-size="11" fill="#1f2933">Ejects inner-shell electrons; passes soft</text>
<text x="413" y="285" font-size="11" fill="#1f2933">tissue; diffracts off crystal planes</text>
<rect x="0" y="294" width="680" height="40" fill="#f5f7fa"/>
<rect x="365.8" y="304" width="29.2" height="18" rx="3" fill="#5b5f8f"/>
<text x="8" y="318" font-size="12.5" font-weight="700" fill="#1f2933">Gamma ray</text>
<text x="413" y="311" font-size="11" fill="#1f2933">Born in atomic nuclei; deeply penetrating</text>
<text x="413" y="325" font-size="11" fill="#1f2933">and strongly ionizing</text>
<text x="301.2" y="197" font-size="10" fill="#52606d">← tiny slice!</text>
<text x="150" y="378" font-size="10" fill="#52606d">Wavelength runs the other way: about 1 km at the far left, about 10⁻¹³ m at the far right.</text>
</svg>